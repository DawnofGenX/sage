[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-mcp-server"
version = "1.0.0"
description = "Sage — passive sales intelligence layer"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.11",
    "mcp>=2.3.0",
    "mcp-types>=2.0.0,<3.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "boto3>=1.34",
    "rich>=13.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pygments>=2",
]

[tool.setuptools.packages.find]
where = ["src"]

# Static analysis (Pyright) needs the same src/ root the runtime uses. Without
# this, every `from tools.sync import ...` and `from sync.local import ...`
# reports as an unresolved import, which buries real type errors in noise.
[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
