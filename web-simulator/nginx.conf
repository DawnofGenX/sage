server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The built SPA calls relative `/api/...` (api.ts uses
    # `import.meta.env.VITE_API_URL || '/api'`). Vite proxies /api to :8000 in
    # dev; in the container nginx must do the same, otherwise every tool call
    # 404s in the Docker stack.
    location /api/ {
        proxy_pass http://mcp-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE streaming endpoint: buffering off or the demo chain arrives as one blob
    # at the end instead of step-by-step.
    location /api/stream/ {
        proxy_pass http://mcp-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
